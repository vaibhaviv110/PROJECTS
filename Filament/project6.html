
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>C  Filament Programs</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }


    

        header {
            background: linear-gradient(135deg, #24292f, #0969da);
            color: white;
            text-align: center;
            padding: 55px 20px;
        }

        header .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        header h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            font-size: 17px;
            color: #d0d7de;
        }



        .main-section {
            padding: 60px 0;
        }


  

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #24292f;
            padding: 10px 18px;
            border-radius: 7px;
            margin-bottom: 35px;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #0969da;
            color: white;
        }



        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 32px;
            font-weight: 700;
            color: #24292f;
        }

        .section-title p {
            color: #666;
            margin-top: 8px;
        }


        .program-card {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 30px 25px;
            height: 100%;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);

            transition: all 0.3s ease;
        }

        .program-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }



        .program-icon {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef4ff;
            color: #0969da;

            border-radius: 50%;

            font-size: 28px;

            margin-bottom: 20px;

            transition: 0.3s;
        }

        .program-card:hover .program-icon {
            background: #0969da;
            color: white;
        }



        .program-card h3 {
            color: #24292f;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .program-card p {
            color: #666;
            line-height: 1.6;
            min-height: 75px;
        }



        .btn-program {
            display: inline-block;
            text-decoration: none;

            background: #24292f;
            color: white;

            padding: 10px 18px;
            border-radius: 7px;

            font-weight: 600;

            transition: 0.3s;
        }

        .btn-program:hover {
            background: #0969da;
            color: white;
        }



        

        .recording-section {
            margin-top: 70px;
            text-align: center;
        }

        .recording-section h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .recording-section video {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }


        

        footer {
            background: #24292f;
            color: white;
            text-align: center;
            padding: 22px 15px;
            margin-top: 50px;
        }

        footer p {
            margin: 0;
            color: #d0d7de;
        }


        
        

        @media (max-width: 768px) {

            header {
                padding: 45px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            .section-title h2 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>



    

    <header>

        <div class="icon">
            <i class="bi bi-arrow-repeat"></i>
        </div>

        <h1>C  Filament Programs</h1>

        <p>
            My C Programming Practice Programs
        </p>

    </header>




    

    <section class="main-section">

            <a href="../index.html" class="back-btn">

                <i class="bi bi-arrow-left"></i>

            </a>
            
            

            <div class="section-title">
                <h2>My Filament Programs</h2>
                <p>
                    Select a program to view the C source code
                </p>
            </div>
       
            
            <div class="row g-4">
                
                
                <div class="col-lg-4 col-md-6">
                    <div class="program-card">
                        <div class="program-icon">
                            <i class="bi bi-code-slash"></i>
                        </div>
                        <h3>
                          Palindrome
                        </h3>
                       
                        <a href="./PALINDRO.CPP" class="btn-program">
                           view Program
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
               
                
                <div class="col-lg-4 col-md-6">
                    <div class="program-card">
                        <div class="program-icon">
                            <i class="bi bi-code-slash"></i>
                        </div>
                        <h3>
                            Frequency
                        </h3>
                       
                        
                        <a href="./FREQCOUN.CPP" class="btn-program">
                            View Program
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>
                
            </div>
        
            
            <div class="recording-section">
                <h2>
                    🎥 All Programs Screen Recording
                </h2>
                <video controls>
                    <source src="./Recording6.webm" type="video/webm">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </section>
   
    
    <footer>
        <p>
            © 2026 C Programming Projects | GitHub Pages
        </p>
    </footer>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
